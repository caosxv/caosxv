<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
<defs>
  <style>
    @keyframes fall1 { 0%{transform:translateY(-10px);opacity:0} 10%{opacity:1} 90%{opacity:0.7} 100%{transform:translateY(330px);opacity:0} }
    @keyframes fall2 { 0%{transform:translateY(-10px);opacity:0} 15%{opacity:0.9} 85%{opacity:0.5} 100%{transform:translateY(330px);opacity:0} }
    @keyframes fall3 { 0%{transform:translateY(-10px);opacity:0} 20%{opacity:1} 80%{opacity:0.6} 100%{transform:translateY(330px);opacity:0} }
    @keyframes sway { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
    .p1{animation:fall1 4s linear infinite; animation-delay:0s}
    .p2{animation:fall1 5s linear infinite; animation-delay:0.7s}
    .p3{animation:fall2 4.5s linear infinite; animation-delay:1.3s}
    .p4{animation:fall3 6s linear infinite; animation-delay:0.3s}
    .p5{animation:fall1 3.8s linear infinite; animation-delay:2.1s}
    .p6{animation:fall2 5.5s linear infinite; animation-delay:1.8s}
    .p7{animation:fall3 4.2s linear infinite; animation-delay:0.9s}
    .p8{animation:fall1 6.2s linear infinite; animation-delay:3.0s}
    .p9{animation:fall2 4.8s linear infinite; animation-delay:2.5s}
    .p10{animation:fall3 5.2s linear infinite; animation-delay:1.5s}
    .p11{animation:fall1 3.5s linear infinite; animation-delay:3.8s}
    .p12{animation:fall2 6.5s linear infinite; animation-delay:0.5s}
    .p13{animation:fall3 4.0s linear infinite; animation-delay:4.2s}
    .p14{animation:fall1 5.8s linear infinite; animation-delay:2.8s}
    .p15{animation:fall2 4.3s linear infinite; animation-delay:3.3s}
    .p16{animation:fall3 5.0s linear infinite; animation-delay:1.1s}
    .p17{animation:fall1 6.8s linear infinite; animation-delay:0.2s}
    .p18{animation:fall2 3.9s linear infinite; animation-delay:4.5s}
    .p19{animation:fall3 5.6s linear infinite; animation-delay:2.2s}
    .p20{animation:fall1 4.7s linear infinite; animation-delay:3.6s}
  </style>
</defs>

<!-- Background: black -->
<rect width="800" height="320" fill="#0d0d0d"/>

<!-- ===================== PIXEL HANYA (CENTER) ===================== -->
<!-- Based on reference: horns, hair, yellow eyes, wrinkles, gold fangs/chains, red mouth -->
<!-- Each pixel = 5x5, mask ~60w x 72h pixels = 300x360 scaled to fit -->
<!-- Centered at 400, top at 10. Scale: 4px per pixel, 52w x 70h = 208x280 -->
<!-- Translate: x = 400 - 104 = 296, y = 10 -->
<g transform="translate(296,8)" fill="#ffffff">

  <!-- HORNS (tan/white in BW) -->
  <!-- Left horn -->
  <rect x="4"   y="0"  width="8"  height="4"  />
  <rect x="0"   y="4"  width="8"  height="4"  />
  <rect x="0"   y="8"  width="12" height="4"  />
  <rect x="0"   y="12" width="16" height="4"  />
  <!-- Right horn -->
  <rect x="196" y="0"  width="8"  height="4"  />
  <rect x="200" y="4"  width="8"  height="4"  />
  <rect x="196" y="8"  width="12" height="4"  />
  <rect x="192" y="12" width="16" height="4"  />

  <!-- BLACK HAIR / TOP OF HEAD -->
  <rect x="16"  y="4"  width="176" height="4"  fill="#1a1a1a"/>
  <rect x="8"   y="8"  width="192" height="4"  fill="#1a1a1a"/>
  <rect x="4"   y="12" width="200" height="8"  fill="#1a1a1a"/>
  <!-- Hair sides hanging -->
  <rect x="0"   y="20" width="20"  height="40" fill="#1a1a1a"/>
  <rect x="188" y="20" width="20"  height="40" fill="#1a1a1a"/>
  <rect x="0"   y="60" width="16"  height="20" fill="#1a1a1a"/>
  <rect x="192" y="60" width="16"  height="20" fill="#1a1a1a"/>

  <!-- FACE white base -->
  <rect x="20"  y="20" width="168" height="180"/>

  <!-- DARK EYE SOCKETS / brow shadow -->
  <rect x="24"  y="28" width="64"  height="8"  fill="#2a2a2a"/>
  <rect x="120" y="28" width="64"  height="8"  fill="#2a2a2a"/>

  <!-- EYE LEFT (yellow → white in BW, with black slit) -->
  <rect x="24"  y="36" width="64"  height="28" fill="#cccccc"/>
  <rect x="48"  y="36" width="16"  height="28" fill="#111111"/>
  <!-- Eye right -->
  <rect x="120" y="36" width="64"  height="28" fill="#cccccc"/>
  <rect x="144" y="36" width="16"  height="28" fill="#111111"/>

  <!-- BROW WRINKLE LINES (gray) -->
  <rect x="36"  y="24" width="4"   height="12" fill="#888888"/>
  <rect x="44"  y="22" width="4"   height="14" fill="#888888"/>
  <rect x="52"  y="20" width="4"   height="16" fill="#888888"/>
  <rect x="156" y="22" width="4"   height="14" fill="#888888"/>
  <rect x="164" y="24" width="4"   height="12" fill="#888888"/>
  <rect x="148" y="20" width="4"   height="16" fill="#888888"/>
  <!-- Center forehead wrinkles -->
  <rect x="96"  y="16" width="4"   height="20" fill="#888888"/>
  <rect x="88"  y="20" width="4"   height="12" fill="#888888"/>
  <rect x="104" y="20" width="4"   height="12" fill="#888888"/>
  <rect x="80"  y="24" width="4"   height="8"  fill="#aaaaaa"/>
  <rect x="112" y="24" width="4"   height="8"  fill="#aaaaaa"/>

  <!-- NOSE -->
  <rect x="92"  y="76" width="24"  height="8"  fill="#cccccc"/>
  <rect x="88"  y="80" width="8"   height="8"  fill="#999999"/>
  <rect x="112" y="80" width="8"   height="8"  fill="#999999"/>

  <!-- CHEEK blush/mark (dark in BW) -->
  <rect x="20"  y="84" width="20"  height="8"  fill="#555555"/>
  <rect x="168" y="84" width="20"  height="8"  fill="#555555"/>

  <!-- CHIN/JAW area -->
  <rect x="20"  y="96"  width="168" height="40"/>
  <rect x="28"  y="136" width="152" height="28"/>
  <rect x="40"  y="164" width="128" height="20"/>
  <rect x="56"  y="184" width="96"  height="16"/>

  <!-- MOUTH opening (black) -->
  <rect x="36"  y="120" width="136" height="8"  fill="#111111"/>

  <!-- TEETH (white blocks) -->
  <rect x="40"  y="128" width="20"  height="16" fill="#f0f0f0"/>
  <rect x="64"  y="128" width="20"  height="16" fill="#f0f0f0"/>
  <rect x="88"  y="128" width="20"  height="16" fill="#f0f0f0"/>
  <rect x="112" y="128" width="20"  height="16" fill="#f0f0f0"/>
  <rect x="136" y="128" width="20"  height="16" fill="#f0f0f0"/>
  <!-- Gaps between teeth -->
  <rect x="60"  y="128" width="4"   height="16" fill="#111111"/>
  <rect x="84"  y="128" width="4"   height="16" fill="#111111"/>
  <rect x="108" y="128" width="4"   height="16" fill="#111111"/>
  <rect x="132" y="128" width="4"   height="16" fill="#111111"/>
  <!-- Red mouth interior → dark gray in BW -->
  <rect x="40"  y="136" width="128" height="8"  fill="#333333"/>

  <!-- FANGS (gold → light gray) -->
  <rect x="36"  y="128" width="8"   height="20" fill="#dddddd"/>
  <rect x="36"  y="148" width="4"   height="8"  fill="#dddddd"/>
  <rect x="164" y="128" width="8"   height="20" fill="#dddddd"/>
  <rect x="168" y="148" width="4"   height="8"  fill="#dddddd"/>

  <!-- GOLD CHAIN/CORD → light lines in BW -->
  <rect x="28"  y="116" width="4"   height="4"  fill="#eeeeee"/>
  <rect x="32"  y="112" width="140" height="4"  fill="#eeeeee"/>
  <rect x="172" y="116" width="4"   height="4"  fill="#eeeeee"/>
  <!-- Chain dangle left -->
  <rect x="28"  y="120" width="4"   height="12" fill="#eeeeee"/>
  <!-- Chain dangle right -->
  <rect x="176" y="120" width="4"   height="12" fill="#eeeeee"/>

  <!-- SIDE FANGS / tusk hints -->
  <rect x="0"   y="96"  width="12"  height="20" fill="#dddddd"/>
  <rect x="4"   y="116" width="8"   height="8"  fill="#cccccc"/>
  <rect x="196" y="96"  width="12"  height="20" fill="#dddddd"/>
  <rect x="196" y="116" width="8"   height="8"  fill="#cccccc"/>

  <!-- OUTLINE / edge darkening -->
  <rect x="20"  y="20"  width="4"   height="180" fill="#888888"/>
  <rect x="184" y="20"  width="4"   height="180" fill="#888888"/>

</g>

