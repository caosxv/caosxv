<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      @keyframes flicker {
        0%,100%{opacity:1} 40%{opacity:0.75} 60%{opacity:0.9}
      }
      @keyframes sway-l {
        0%,100%{transform:rotate(-3deg) translateX(0)} 50%{transform:rotate(3deg) translateX(2px)}
      }
      @keyframes sway-r {
        0%,100%{transform:rotate(3deg) translateX(0)} 50%{transform:rotate(-3deg) translateX(-2px)}
      }
      @keyframes ember1 {
        0%{cy:210;opacity:0.8} 100%{cy:160;opacity:0}
      }
      @keyframes ember2 {
        0%{cy:220;opacity:0.7} 100%{cy:165;opacity:0}
      }
      @keyframes ember3 {
        0%{cy:205;opacity:0.9} 100%{cy:155;opacity:0}
      }
      .hanya { animation: flicker 4s ease-in-out infinite; }
      .lily-left { transform-origin: 138px 280px; animation: sway-l 5s ease-in-out infinite; }
      .lily-right { transform-origin: 462px 280px; animation: sway-r 5s ease-in-out infinite; }
    </style>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="100%" stop-color="#050000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cc0000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="600" height="300" fill="url(#bg)"/>
  <ellipse cx="300" cy="160" rx="220" ry="140" fill="url(#glow)"/>

  <!-- ======= LEFT LILY ======= -->
  <g class="lily-left">
    <!-- Stem -->
    <rect x="134" y="155" width="8" height="130" fill="#1c4d1c"/>
    <!-- Leaves -->
    <path d="M138 210 Q115 200 100 195 Q118 205 138 215 Z" fill="#1c4d1c"/>
    <path d="M138 230 Q162 220 175 215 Q158 225 138 235 Z" fill="#1c4d1c"/>

    <!-- Petals - deep crimson -->
    <path d="M138 155 Q130 128 120 108 Q132 122 142 142 Z" fill="#bb0000"/>
    <path d="M138 155 Q160 135 176 120 Q160 138 148 150 Z" fill="#bb0000"/>
    <path d="M138 155 Q165 155 180 152 Q163 162 146 158 Z" fill="#bb0000"/>
    <path d="M138 155 Q158 178 163 195 Q146 175 140 165 Z" fill="#bb0000"/>
    <path d="M138 155 Q116 178 111 195 Q124 175 136 165 Z" fill="#bb0000"/>
    <path d="M138 155 Q110 155 95 152 Q112 162 130 158 Z" fill="#bb0000"/>
    <path d="M138 155 Q116 135 100 120 Q116 138 128 150 Z" fill="#bb0000"/>

    <!-- Petal sheen -->
    <path d="M138 155 Q130 128 120 108 Q126 118 136 140 Z" fill="#dd2222" opacity="0.5"/>
    <path d="M138 155 Q160 135 176 120 Q165 133 150 148 Z" fill="#dd2222" opacity="0.5"/>

    <!-- Center -->
    <circle cx="138" cy="154" r="6" fill="#990000"/>
    <circle cx="138" cy="154" r="3" fill="#cc3300"/>

    <!-- Stamens -->
    <line x1="138" y1="152" x2="120" y2="118" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="138" y1="152" x2="155" y2="112" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="138" y1="152" x2="168" y2="130" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="138" y1="152" x2="172" y2="152" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="138" y1="152" x2="160" y2="176" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="138" y1="152" x2="116" y2="176" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="138" y1="152" x2="104" y2="152" stroke="#ff5500" stroke-width="1.3"/>
    <circle cx="120" cy="117" r="2.5" fill="#ff6600"/>
    <circle cx="155" cy="111" r="2.5" fill="#ff6600"/>
    <circle cx="168" cy="129" r="2.5" fill="#ff6600"/>
    <circle cx="172" cy="151" r="2.5" fill="#ff6600"/>
    <circle cx="160" cy="177" r="2.5" fill="#ff6600"/>
    <circle cx="116" cy="177" r="2.5" fill="#ff6600"/>
    <circle cx="103" cy="151" r="2.5" fill="#ff6600"/>
  </g>

  <!-- ======= RIGHT LILY ======= -->
  <g class="lily-right">
    <!-- Stem -->
    <rect x="458" y="155" width="8" height="130" fill="#1c4d1c"/>
    <!-- Leaves -->
    <path d="M462 210 Q440 200 425 195 Q443 205 462 215 Z" fill="#1c4d1c"/>
    <path d="M462 230 Q485 220 500 215 Q483 225 462 235 Z" fill="#1c4d1c"/>

    <!-- Petals -->
    <path d="M462 155 Q454 128 444 108 Q456 122 466 142 Z" fill="#bb0000"/>
    <path d="M462 155 Q484 135 500 120 Q484 138 472 150 Z" fill="#bb0000"/>
    <path d="M462 155 Q489 155 504 152 Q487 162 470 158 Z" fill="#bb0000"/>
    <path d="M462 155 Q482 178 487 195 Q470 175 464 165 Z" fill="#bb0000"/>
    <path d="M462 155 Q440 178 435 195 Q448 175 460 165 Z" fill="#bb0000"/>
    <path d="M462 155 Q434 155 419 152 Q436 162 454 158 Z" fill="#bb0000"/>
    <path d="M462 155 Q440 135 424 120 Q440 138 452 150 Z" fill="#bb0000"/>

    <!-- Petal sheen -->
    <path d="M462 155 Q454 128 444 108 Q450 118 460 140 Z" fill="#dd2222" opacity="0.5"/>
    <path d="M462 155 Q484 135 500 120 Q489 133 474 148 Z" fill="#dd2222" opacity="0.5"/>

    <!-- Center -->
    <circle cx="462" cy="154" r="6" fill="#990000"/>
    <circle cx="462" cy="154" r="3" fill="#cc3300"/>

    <!-- Stamens -->
    <line x1="462" y1="152" x2="444" y2="118" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="462" y1="152" x2="479" y2="112" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="462" y1="152" x2="492" y2="130" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="462" y1="152" x2="496" y2="152" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="462" y1="152" x2="484" y2="176" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="462" y1="152" x2="440" y2="176" stroke="#ff5500" stroke-width="1.3"/>
    <line x1="462" y1="152" x2="428" y2="152" stroke="#ff5500" stroke-width="1.3"/>
    <circle cx="444" cy="117" r="2.5" fill="#ff6600"/>
    <circle cx="479" cy="111" r="2.5" fill="#ff6600"/>
    <circle cx="492" cy="129" r="2.5" fill="#ff6600"/>
    <circle cx="496" cy="151" r="2.5" fill="#ff6600"/>
    <circle cx="484" cy="177" r="2.5" fill="#ff6600"/>
    <circle cx="440" cy="177" r="2.5" fill="#ff6600"/>
    <circle cx="427" cy="151" r="2.5" fill="#ff6600"/>
  </g>

  <!-- ======= PIXEL HANYA (center) ======= -->
  <!-- Each rect = 6x6 pixel, mask ~17w x 22h = 102x132px, centered at 300,145 -->
  <g class="hanya" transform="translate(201, 60)" filter="url(#glow-red)">
    <!-- px size = 6 -->
    <!-- Horns -->
    <rect x="12"  y="0"  width="12" height="6"  fill="#f5f0e8"/>
    <rect x="72"  y="0"  width="12" height="6"  fill="#f5f0e8"/>
    <rect x="12"  y="6"  width="12" height="6"  fill="#f5f0e8"/>
    <rect x="72"  y="6"  width="12" height="6"  fill="#f5f0e8"/>
    <!-- Forehead top -->
    <rect x="6"   y="12" width="84" height="6"  fill="#f5f0e8"/>
    <!-- Gold headband -->
    <rect x="0"   y="18" width="96" height="6"  fill="#c8a000"/>
    <rect x="6"   y="18" width="84" height="6"  fill="#d4b000"/>
    <!-- Face top -->
    <rect x="0"   y="24" width="96" height="6"  fill="#f5f0e8"/>
    <rect x="0"   y="30" width="96" height="6"  fill="#f5f0e8"/>
    <!-- Eye row -->
    <!-- Left eye socket (gold) -->
    <rect x="6"   y="36" width="24" height="18" fill="#c0980a"/>
    <!-- Left pupil (black slit) -->
    <rect x="15"  y="36" width="6"  height="18" fill="#0a0000"/>
    <!-- Right eye socket (gold) -->
    <rect x="66"  y="36" width="24" height="18" fill="#c0980a"/>
    <!-- Right pupil -->
    <rect x="75"  y="36" width="6"  height="18" fill="#0a0000"/>
    <!-- Nose bridge -->
    <rect x="30"  y="30" width="36" height="30" fill="#f0e8dc"/>
    <!-- Cheek sides -->
    <rect x="0"   y="36" width="6"  height="18" fill="#e8ddd0"/>
    <rect x="90"  y="36" width="6"  height="18" fill="#e8ddd0"/>
    <!-- Cheek blush -->
    <rect x="0"   y="54" width="96" height="6"  fill="#f0e8dc"/>
    <rect x="6"   y="54" width="18" height="6"  fill="#cc2222"/>
    <rect x="72"  y="54" width="18" height="6"  fill="#cc2222"/>
    <!-- Nose -->
    <rect x="36"  y="60" width="24" height="6"  fill="#c4a090"/>
    <!-- Mouth gap -->
    <rect x="12"  y="66" width="72" height="6"  fill="#0a0000"/>
    <!-- Teeth upper -->
    <rect x="18"  y="72" width="12" height="10" fill="#f5f5f5"/>
    <rect x="33"  y="72" width="12" height="10" fill="#f5f5f5"/>
    <rect x="48"  y="72" width="12" height="10" fill="#f5f5f5"/>
    <rect x="63"  y="72" width="12" height="10" fill="#f5f5f5"/>
    <!-- Fangs -->
    <rect x="18"  y="82" width="6"  height="8"  fill="#f5f5f5"/>
    <rect x="72"  y="82" width="6"  height="8"  fill="#f5f5f5"/>
    <!-- Chin -->
    <rect x="12"  y="90" width="72" height="6"  fill="#f0e8dc"/>
    <rect x="18"  y="96" width="60" height="6"  fill="#f0e8dc"/>
    <rect x="24"  y="102" width="48" height="6" fill="#f0e8dc"/>
    <rect x="30"  y="108" width="36" height="5" fill="#f0e8dc"/>
  </g>

  <!-- Floating embers -->
  <circle r="2" fill="#cc0000" opacity="0.8">
    <animate attributeName="cx" values="230" dur="0s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="220;170;220" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    <set attributeName="cx" to="230"/>
  </circle>
  <circle cx="260" r="1.5" fill="#ff4400" opacity="0.6">
    <animate attributeName="cy" values="215;158;215" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" r="2" fill="#cc0000" opacity="0.7">
    <animate attributeName="cy" values="225;168;225" dur="3.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="3.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="375" r="1.5" fill="#ff3300" opacity="0.5">
    <animate attributeName="cy" values="210;155;210" dur="2.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="305" r="1" fill="#ff6600" opacity="0.4">
    <animate attributeName="cy" values="230;175;230" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Ground fog -->
  <rect x="80" y="280" width="440" height="3" fill="#cc0000" opacity="0.2" rx="2"/>

  <!-- Title text -->
  <text x="300" y="258" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc0000" opacity="0.7" letter-spacing="4">caosxv</text>
  <text x="300" y="272" text-anchor="middle" font-family="monospace" font-size="8" fill="#880000" opacity="0.5" letter-spacing="2">彼岸花</text>
</svg>
