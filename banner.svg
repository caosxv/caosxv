  <rect x="68"  y="152" width="8"  height="8"  fill="#555555"/>
  <rect x="36"  y="152" width="8"  height="8"  fill="#555555"/>

  <!-- Stamen filaments -->
  <rect x="50"  y="128" width="2"  height="30" fill="#cccccc"/>
  <rect x="56"  y="126" width="2"  height="32" fill="#cccccc"/>
  <rect x="62"  y="130" width="2"  height="28" fill="#cccccc"/>
  <rect x="44"  y="132" width="2"  height="26" fill="#cccccc"/>
  <!-- Stamen tips -->
  <rect x="48"  y="124" width="4"  height="4"  fill="#eeeeee"/>
  <rect x="54"  y="122" width="4"  height="4"  fill="#eeeeee"/>
  <rect x="60"  y="126" width="4"  height="4"  fill="#eeeeee"/>
  <rect x="42"  y="128" width="4"  height="4"  fill="#eeeeee"/>
